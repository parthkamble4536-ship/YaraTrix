version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://yaratrix:yaratrix_pass@db:5432/yaratrix_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./rules:/app/rules
      - ./data:/app/data
      - ./reports:/app/reports

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=yaratrix
      - POSTGRES_PASSWORD=yaratrix_pass
      - POSTGRES_DB=yaratrix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaratrix -d yaratrix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
